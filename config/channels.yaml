# =========================================================================
#  Configuración de los 3 canales.
#  Un solo motor de edición + 3 perfiles = 3 cuentas sin pagar SaaS.
#
#  Cambiá aquí el estilo de cada canal sin tocar el código.
# =========================================================================

# Ajustes globales del motor (aplican a todos salvo que el canal los pise)
defaults:
  whisper_model: "small"        # tiny/base/small/medium. "small" = buen equilibrio en CPU.
  language: null                # null = autodetectar idioma. "es"/"en" para forzar.
  target_width: 1080            # resolución vertical de salida (9:16)
  target_height: 1920
  short_min_seconds: 15         # duración mínima de cada short
  short_max_seconds: 58         # < 60s para que cuente como Short
  clips_per_source: 3           # cuántos shorts sacar de cada video fuente
  crop_mode: "blur"             # "crop" (rellena, recorta laterales) o "blur" (encaja con fondo borroso)
  # Estilo de subtítulos "virales" (karaoke, palabra por palabra)
  caption:
    font: "Arial Black"
    font_size: 90                   # px sobre el lienzo vertical 1080x1920
    primary_color: "&H00FFFFFF"     # texto normal (blanco) - formato ASS &HAABBGGRR
    highlight_color: "&H0000F0FF"   # palabra activa (amarillo)
    outline: 3
    shadow: 1
    margin_v: 700                   # karaoke en el tercio medio-bajo (y≈1000-1220). Con 360 caía
                                    # dentro del bottom-480 que tapa la UI de Shorts/TikTok (fórmula §6)
    uppercase: true

# -------------------------------------------------------------------------
# CANAL 1 — Solo streamers (el más seguro y monetizable)
# -------------------------------------------------------------------------
streamers:
  display_name: "Clips de Streamers"
  crop_mode: "crop"               # gameplay/cara centrada: recortar da más inmersión
  clips_per_source: 4
  hook_text: ""                   # gancho superior opcional, ej: "😱 NO VAS A CREER ESTO"
  # Recordatorio legal: usar clips con permiso del streamer o de streamers
  # que permiten canales de clips. Añadir siempre valor (subs, edición, gancho).
  legal_note: "Requiere permiso del streamer o edición transformadora."

# -------------------------------------------------------------------------
# CANAL 2 — Streamers + series/películas (mayor alcance, mayor riesgo)
# -------------------------------------------------------------------------
peliculas_series:
  display_name: "Escenas y Momentos"
  crop_mode: "blur"               # cine en 16:9 -> fondo borroso conserva el encuadre
  clips_per_source: 3
  hook_text: ""
  caption:
    highlight_color: "&H0000D7FF"  # naranja para diferenciar el canal
  legal_note: "ALTO RIESGO de Content ID. Solo con edición muy transformadora (reseña/comentario)."

# -------------------------------------------------------------------------
# CANAL 3 — Faceless original (cero riesgo de copyright)
# -------------------------------------------------------------------------
faceless:
  display_name: "En 60 Segundos"
  whisper_model: "small"          # más precisión en los subtítulos (un poco más lento)
  crop_mode: "blur"
  clips_per_source: 1             # se genera 1 short por guion/fuente original
  hook_text: ""
  tts_voice: "es-MX-DaliaNeural"  # voz IA (edge-tts). Ver voces: python -m src.tts
  tts_rate: "+8%"                 # +% = más rápido (más retención en Shorts)
  legal_note: "Contenido propio generado con IA/stock. Sin riesgo de copyright."

# -------------------------------------------------------------------------
# CANAL NUEVO — Historia en 60 Segundos (faceless de datos históricos)
# -------------------------------------------------------------------------
historia:
  display_name: "Historia en 60 Segundos"
  whisper_model: "small"
  crop_mode: "blur"
  clips_per_source: 1
  hook_text: ""
  tts_voice: "es-MX-JorgeNeural"   # provisional: se confirma con muestras (plan Task 7)
  tts_rate: "+8%"                  # relato un toque más pausado que el canal 1
  caption:
    highlight_color: "&H0000A5FF"  # dorado/ámbar para diferenciar el canal
  legal_note: "Contenido propio generado con IA/stock. Sin riesgo de copyright."

# -------------------------------------------------------------------------
# CANAL 3 — Misterios en 60 Segundos (faceless de misterios reales)
# -------------------------------------------------------------------------
misterios:
  display_name: "Misterios en 60 Segundos"
  whisper_model: "small"
  crop_mode: "blur"
  clips_per_source: 1
  hook_text: ""
  tts_voice: "es-MX-DaliaNeural" # voz elegida por el usuario: más narrativa y pausada
  tts_rate: "+8%"                  # más pausado, clima de misterio
  caption:
    highlight_color: "&H000000FF"  # ROJO (BGR de ASS): refuerza el tono del canal (fórmula §6)
  legal_note: "Contenido propio generado con IA/stock. Sin riesgo de copyright."

# -------------------------------------------------------------------------
# CANAL — ¿Soy el Malo? (historias de Reddit; voz por género del narrador)
# -------------------------------------------------------------------------
soyelmalo:
  display_name: "¿Soy el Malo?"
  whisper_model: "small"
  crop_mode: "crop"                 # gameplay vertical a pantalla completa
  clips_per_source: 1
  hook_text: ""
  tts_voice: "es-MX-DaliaNeural"    # default; el render lo pisa por historia (Jorge/Dalia)
  tts_rate: "+15%"                   # drama un toque más ágil
  short_max_seconds: 75              # permite hasta ~75s
  caption:
    highlight_color: "&H0000F0FF"   # amarillo (el highlight que mejor rinde)
  legal_note: "Reescritura original de historias de Reddit. Ver docs/superpowers/specs/."
