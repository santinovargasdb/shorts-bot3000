# =========================================================================
#  Configuración de los 3 canales.
#  Un solo motor de edición + 3 perfiles = 3 cuentas sin pagar SaaS.
#
#  Cambiá aquí el estilo de cada canal sin tocar el código.
# =========================================================================

# Ajustes globales del motor (aplican a todos salvo que el canal los pise)
defaults:
  whisper_model: "small"        # tiny/base/small/medium. "small" = buen equilibrio en CPU.
  language: null                # null = autodetectar idioma. "es"/"en" para forzar.
  target_width: 1080            # resolución vertical de salida (9:16)
  target_height: 1920
  short_min_seconds: 15         # duración mínima de cada short
  short_max_seconds: 58         # < 60s para que cuente como Short
  clips_per_source: 3           # cuántos shorts sacar de cada video fuente
  crop_mode: "blur"             # "crop" (rellena, recorta laterales) o "blur" (encaja con fondo borroso)
  # Estilo de subtítulos "virales" (karaoke, palabra por palabra)
  caption:
    font: "Arial Black"
    font_size: 90                   # px sobre el lienzo vertical 1080x1920
    primary_color: "&H00FFFFFF"     # texto normal (blanco) - formato ASS &HAABBGGRR
    highlight_color: "&H0000F0FF"   # palabra activa (amarillo)
    outline: 3
    shadow: 1
    margin_v: 700                   # karaoke en el tercio medio-bajo (y≈1000-1220). Con 360 caía
                                    # dentro del bottom-480 que tapa la UI de Shorts/TikTok (fórmula §6)
    uppercase: true

# -------------------------------------------------------------------------
# CANAL 1 — Solo streamers (el más seguro y monetizable)
# -------------------------------------------------------------------------
streamers:
  display_name: "Clips de Streamers"
  whisper_model: "medium"         # habla rápida + slang: 'medium' baja errores de transcripción
  language: "es"                  # A/B son hispanos: forzar ES evita que el autodetect falle en clips cortos
  crop_mode: "crop"               # gameplay/cara centrada: recortar da más inmersión
  clips_per_source: 4
  hook_text: ""
  # Estilo "clip viral" (ref. @kiks_clips / DEAGZZZSHORTS): subtítulo pesado
  # MAYÚSCULA al medio con highlight ROJO, + grade cálido/contrastado/viñeta.
  caption:
    font: "Montserrat Black"        # CALCO de la ref: Montserrat Black ITÁLICA (fonts/, vía fontsdir)
    font_size: 96
    primary_color: "&H00FFFFFF"     # texto blanco
    highlight_color: "&H001414FF"   # palabra activa en ROJO vívido (R255 G20 B20), como la ref
    outline: 4                      # borde negro grueso...
    shadow: 0
    blur: 6                         # ...difuminado = glow suave (la ref tiene halo, no outline duro)
    italic: true                    # la ref es itálica marcada
    margin_v: 800                   # subtítulo al MEDIO vertical (no abajo)
    uppercase: true
  # Grade de color (se aplica al video, NO a los subtítulos): contraste + saturación
  # + empuje cálido (más rojo / menos azul) + viñeta. El look dramático de la ref.
  grade: "eq=contrast=1.12:saturation=1.35,colorbalance=rm=.04:bm=-.03:rh=.03:bh=-.02,vignette=PI/5"
  # Música firma por mood: el LLM clasifica el clip -> emotiva.mp3 (emotivo) o
  # graciosa.mp3 (gracioso), en music/streamers/. Se mezcla bajo el audio del clip.
  music_mood: true
  # Recorta a la FACECAM del streamer (detección de cara) en vez del centro (gameplay).
  face_crop: true
  # Zoom-punch: golpe breve de zoom cada N segundos (el "corte" de energía de los clips
  # virales, emulado sobre una sola fuente). Ritmo ~2.5s = el que medí en las refs.
  zoom_punch: true
  punch_interval: 2.5
  # Whoosh (sfx/whoosh.wav) que barre hacia cada zoom-punch. Sintetizado gratis; auditar y
  # reemplazar el archivo si se quiere otro sonido. sfx_vol = bajo, de fondo (no tapar la voz).
  sfx_cut: true
  sfx_vol: 0.3
  # Layout auto por clip: si la cara es un box chico (gameplay detrás) -> 2 paneles
  # (cara/juego/negro); si llena el cuadro (IRL/charla) -> facecam-only (nicho inglés).
  layout: "auto"
  gaming_face_frac: 0.18            # cara < 18% del ancho => hay gameplay => 2 paneles
  caption_margin_gaming: 560        # subtítulo en la banda negra, debajo del gameplay
  caption_margin_facecam: 660       # facecam-only: un poco más abajo que antes (no tapar la cara)
  crf: 18                           # calidad de encoding alta (18 < 20 = más nítido). La facecam
                                    # se escala con lanczos + unsharp para no verse blanda.
  legal_note: "Requiere permiso del streamer o edición transformadora."

# -------------------------------------------------------------------------
# CANAL 2 — Streamers + series/películas (mayor alcance, mayor riesgo)
# -------------------------------------------------------------------------
peliculas_series:
  display_name: "Escenas y Momentos"
  crop_mode: "blur"               # cine en 16:9 -> fondo borroso conserva el encuadre
  clips_per_source: 3
  hook_text: ""
  caption:
    highlight_color: "&H0000D7FF"  # naranja para diferenciar el canal
  legal_note: "ALTO RIESGO de Content ID. Solo con edición muy transformadora (reseña/comentario)."

# -------------------------------------------------------------------------
# CANAL 3 — Faceless original (cero riesgo de copyright)
# -------------------------------------------------------------------------
faceless:
  display_name: "En 60 Segundos"
  whisper_model: "small"          # más precisión en los subtítulos (un poco más lento)
  crop_mode: "blur"
  clips_per_source: 1             # se genera 1 short por guion/fuente original
  hook_text: ""
  tts_voice: "es-MX-DaliaNeural"  # voz IA (edge-tts). Ver voces: python -m src.tts
  tts_rate: "+8%"                 # +% = más rápido (más retención en Shorts)
  legal_note: "Contenido propio generado con IA/stock. Sin riesgo de copyright."

# -------------------------------------------------------------------------
# CANAL NUEVO — Historia en 60 Segundos (faceless de datos históricos)
# -------------------------------------------------------------------------
historia:
  display_name: "Historia en 60 Segundos"
  whisper_model: "small"
  crop_mode: "blur"
  clips_per_source: 1
  hook_text: ""
  tts_voice: "es-MX-JorgeNeural"   # provisional: se confirma con muestras (plan Task 7)
  tts_rate: "+8%"                  # relato un toque más pausado que el canal 1
  caption:
    highlight_color: "&H0000A5FF"  # dorado/ámbar para diferenciar el canal
  legal_note: "Contenido propio generado con IA/stock. Sin riesgo de copyright."

# -------------------------------------------------------------------------
# CANAL 3 — Misterios en 60 Segundos (faceless de misterios reales)
# -------------------------------------------------------------------------
misterios:
  display_name: "Misterios en 60 Segundos"
  whisper_model: "small"
  crop_mode: "blur"
  clips_per_source: 1
  hook_text: ""
  tts_voice: "es-MX-DaliaNeural" # voz elegida por el usuario: más narrativa y pausada
  tts_rate: "+8%"                  # más pausado, clima de misterio
  caption:
    highlight_color: "&H000000FF"  # ROJO (BGR de ASS): refuerza el tono del canal (fórmula §6)
  legal_note: "Contenido propio generado con IA/stock. Sin riesgo de copyright."

# -------------------------------------------------------------------------
# CANAL — ¿Soy el Malo? (historias de Reddit; voz por género del narrador)
# -------------------------------------------------------------------------
soyelmalo:
  display_name: "¿Soy el Malo?"
  whisper_model: "small"
  crop_mode: "crop"                 # gameplay vertical a pantalla completa
  clips_per_source: 1
  hook_text: ""
  tts_voice: "es-MX-DaliaNeural"    # default; el render lo pisa por historia (Jorge/Dalia)
  tts_rate: "+8%"                    # más pausado, con peso dramático (antes +15%)
  short_max_seconds: 130             # permite ~90-120s (antes 75)
  caption:
    highlight_color: "&H0000F0FF"   # amarillo: highlight del karaoke (el que mejor rinde)
    accent_color: "&H000045FF"      # naranja Reddit: título + pregunta (distinto del karaoke)
    title_frac: 0.24                # título (post) arriba del todo, separado del karaoke
    margin_v: 780                   # karaoke un poco más alto: deja aire para la pregunta abajo
  legal_note: "Reescritura original de historias de Reddit. Ver docs/superpowers/specs/."
